<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Year-Aware Habit Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-calendar-check"></i> Year-Aware Habit Tracker</h1>
            <div class="year-display">
                <span id="current-year">2026</span>
                <div class="date-info">
                    <span id="current-date">January 2, 2026</span>
                    <span id="streak-counter" class="streak-badge">🔥 0 Day Streak</span>
                </div>
                <div class="header-buttons">
                    <button id="dark-mode-toggle" class="btn-secondary" title="Toggle Dark Mode">
                        <i class="fas fa-moon"></i>
                    </button>
                    <button id="export-btn" class="btn-secondary">
                        <i class="fas fa-download"></i> Export
                    </button>
                    <button id="import-btn" class="btn-secondary">
                        <i class="fas fa-upload"></i> Import
                    </button>
                    <input type="file" id="import-file" accept=".json" style="display: none;">
                </div>
            </div>
        </header>

        <main>
            <div class="dashboard">
                <div class="left-panel">
                    <div class="calendar-container">
                        <h2><i class="fas fa-calendar-alt"></i> Year Calendar</h2>
                        <div class="calendar-controls">
                            <button id="prev-year" class="btn-icon"><i class="fas fa-chevron-left"></i></button>
                            <h3 id="year-title">2026</h3>
                            <button id="next-year" class="btn-icon"><i class="fas fa-chevron-right"></i></button>
                        </div>
                        <div id="year-calendar" class="year-calendar"></div>
                    </div>
                </div>

                <div class="right-panel">
                    <div class="daily-checklist">
                        <div class="checklist-header">
                            <h2><i class="fas fa-tasks"></i> Today's Habits</h2>
                            <div class="completion-stats">
                                <span id="completion-percent">0%</span>
                                <span class="completion-label">Complete</span>
                                <div class="progress-bar">
                                    <div id="progress-fill"></div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="today-date">
                            <i class="far fa-calendar"></i>
                            <span id="today-date">Today, January 2, 2026</span>
                        </div>
                        
                        <div id="habits-list" class="habits-list"></div>
                        
                        <div class="checklist-actions">
                            <button id="edit-habits-btn" class="btn-primary">
                                <i class="fas fa-edit"></i> Edit Habits
                            </button>
                            <button id="save-today-btn" class="btn-success">
                                <i class="fas fa-save"></i> Save Progress
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="analytics-section">
                <h2><i class="fas fa-chart-line"></i> Analytics</h2>
                <div class="charts-container">
                    <div class="chart-box">
                        <h3>Monthly Completion (%)</h3>
                        <canvas id="monthly-chart"></canvas>
                    </div>
                    <div class="chart-box">
                        <h3>Per-Habit Completion Rate</h3>
                        <canvas id="habit-chart"></canvas>
                    </div>
                    <div class="stats-box">
                        <h3>Your Stats</h3>
                        <div class="stats-grid">
                            <div class="stat-item">
                                <div class="stat-value" id="total-completed">0</div>
                                <div class="stat-label">Total Completed Days</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-value" id="current-streak">0</div>
                                <div class="stat-label">Current Streak</div>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Year-Aware Habit Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-calendar-check"></i> Year-Aware Habit Tracker</h1>
            <div class="year-display">
                <span id="current-year">2026</span>
                <div class="date-info">
                    <span id="current-date">January 1, 2026</span>
                    <span id="streak-counter" class="streak-badge">🔥 0 Day Streak</span>
                </div>
<button id="export-btn" class="btn-secondary">
    <i class="fas fa-download"></i> Export Data
</button>
<button id="import-btn" class="btn-secondary">
    <i class="fas fa-upload"></i> Import Data
</button>
<input type="file" id="import-file" accept=".json" style="display: none;">
            </div>
        </header>

        <main>
            <div class="dashboard">
                <div class="left-panel">
                    <div class="calendar-container">
                        <h2><i class="fas fa-calendar-alt"></i> Year Calendar</h2>
                        <div class="calendar-controls">
                            <button id="prev-year" class="btn-icon" title="Previous Year"><i class="fas fa-chevron-left"></i></button>
